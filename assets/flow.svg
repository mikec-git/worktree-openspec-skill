<svg xmlns="http://www.w3.org/2000/svg" width="880" height="216" viewBox="0 0 880 216" role="img" aria-label="Flow: Scope to Branch to Worktree to OpenSpec to Plan (re-run status until unblocked) to Handoff.">
  <defs>
    <radialGradient id="sheen2" cx="0.5" cy="-0.1" r="1">
      <stop offset="0" stop-color="#161c2a"/>
      <stop offset="0.7" stop-color="#0b0e14"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#465067" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#f6a87c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="216" rx="18" fill="url(#sheen2)"/>
  <rect x="0.5" y="0.5" width="879" height="215" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <!-- connectors -->
  <g stroke="#2c3346" stroke-width="2" marker-end="url(#arr)">
    <line x1="111" y1="118" x2="193" y2="118"/>
    <line x1="255" y1="118" x2="337" y2="118"/>
    <line x1="399" y1="118" x2="481" y2="118"/>
    <line x1="543" y1="118" x2="625" y2="118"/>
    <line x1="687" y1="118" x2="769" y2="118"/>
  </g>

  <!-- re-validate loop: Plan -> OpenSpec -->
  <path d="M644 88 C 604 44, 552 44, 512 88" fill="none" stroke="#f6a87c" stroke-opacity="0.85" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrp)"/>
  <text x="578" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.3" fill="#f6a87c">re-run status until apply unblocks</text>

  <!-- nodes -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- 1 Scope -->
    <rect x="51" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#8b7cf6" stroke-width="1.5"/>
    <g transform="translate(80,118)" stroke="#8b7cf6" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10,-8 H10 V5 H-1 L-6,10 V5 H-10 Z"/>
    </g>
    <text x="80" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#8b7cf6">?</text>
    <text x="80" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">Scope</text>

    <!-- 2 Branch -->
    <rect x="195" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#a78bf0" stroke-width="1.5"/>
    <g transform="translate(224,118)" stroke="#a78bf0" stroke-width="2" fill="#141a28" stroke-linecap="round">
      <line x1="-6" y1="-8" x2="-6" y2="9"/>
      <path d="M-6,-2 C -6,5 7,2 7,-4" fill="none"/>
      <circle cx="-6" cy="-9" r="2.8"/>
      <circle cx="-6" cy="9" r="2.8"/>
      <circle cx="7" cy="-9" r="2.8"/>
    </g>
    <text x="224" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">Branch</text>

    <!-- 3 Worktree -->
    <rect x="339" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#c98bf0" stroke-width="1.5"/>
    <g transform="translate(368,118)" stroke="#c98bf0" stroke-width="1.9" fill="#141a28" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="-9" x2="0" y2="-1"/>
      <path d="M-8,8 V2 H8 V8" fill="none"/>
      <line x1="0" y1="-1" x2="0" y2="2"/>
      <circle cx="0" cy="-9" r="2.8" fill="#c98bf0"/>
      <circle cx="-8" cy="9" r="2.8" fill="#c98bf0"/>
      <circle cx="8" cy="9" r="2.8" fill="#c98bf0"/>
    </g>
    <text x="368" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">Worktree</text>

    <!-- 4 OpenSpec -->
    <rect x="483" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#e6a0c4" stroke-width="1.5"/>
    <g transform="translate(512,118)" stroke="#e6a0c4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-8,-11 H4 L8,-7 V11 H-8 Z"/>
      <path d="M4,-11 V-7 H8"/>
      <line x1="-4" y1="-2" x2="4" y2="-2"/>
      <line x1="-4" y1="3" x2="4" y2="3"/>
    </g>
    <text x="512" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">OpenSpec</text>

    <!-- 5 Plan -->
    <rect x="627" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#f6a87c" stroke-width="1.5"/>
    <g transform="translate(656,118)" stroke="#f6a87c" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10,-8 L-6,-4 L-1,-9"/>
      <line x1="2" y1="-7" x2="10" y2="-7"/>
      <path d="M-10,5 L-6,9 L-1,4"/>
      <line x1="2" y1="6" x2="10" y2="6"/>
    </g>
    <text x="656" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">Plan</text>

    <!-- 6 Handoff -->
    <rect x="771" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#7fe7d0" stroke-width="1.5"/>
    <g transform="translate(800,118)" stroke="#7fe7d0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-8" y1="-10" x2="-8" y2="11"/>
      <path d="M-8,-9 H9 L4,-4 L9,1 H-8" fill="#7fe7d0" fill-opacity="0.18"/>
    </g>
    <text x="800" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">Handoff</text>
  </g>
</svg>
