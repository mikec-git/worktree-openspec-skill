<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Worktree OpenSpec — Scope, Branch, Scaffold, Plan. Consistent OpenSpec worktrees for Codex and Claude, planned before any code is written.">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="0.38" stop-color="#c98bf0"/>
      <stop offset="0.72" stop-color="#f6a87c"/>
      <stop offset="1" stop-color="#7fe7d0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.16" cy="0" r="0.95">
      <stop offset="0" stop-color="#1b2030"/>
      <stop offset="0.62" stop-color="#0b0e14"/>
    </radialGradient>
    <clipPath id="card"><rect x="0" y="0" width="880" height="300" rx="18"/></clipPath>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="56"/>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="880" height="300" fill="url(#sheen)"/>
    <ellipse cx="300" cy="-24" rx="430" ry="150" fill="url(#aurora)" opacity="0.32" filter="url(#glow)"/>
    <rect x="0.5" y="0.5" width="879" height="299" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="46" y="120" font-size="56" font-weight="800" letter-spacing="-1.4" fill="url(#aurora)">Worktree OpenSpec</text>
    <text x="49" y="156" font-size="13" font-weight="600" letter-spacing="3.6" fill="#c7cee0">SCOPE&#160;&#160;·&#160;&#160;BRANCH&#160;&#160;·&#160;&#160;SCAFFOLD&#160;&#160;·&#160;&#160;PLAN</text>
    <text x="49" y="190" font-size="16" fill="#9aa4b6">Consistent OpenSpec worktrees for Codex &amp; Claude, planned before any code is written.</text>
  </g>

  <!-- git graph motif: main line with a worktree branch diverging -->
  <g>
    <!-- main lane -->
    <line x1="56" y1="252" x2="330" y2="252" stroke="#2c3346" stroke-width="2.4"/>
    <!-- branch diverging up into a worktree lane -->
    <path d="M120 252 C 150 252, 154 226, 184 226 L 300 226" fill="none" stroke="#3a4a5e" stroke-width="2.4"/>
    <!-- main commit dots -->
    <circle cx="56"  cy="252" r="5.5" fill="#8b7cf6"/>
    <circle cx="120" cy="252" r="5.5" fill="#a78bf0"/>
    <circle cx="200" cy="252" r="5.5" fill="#c98bf0"/>
    <circle cx="280" cy="252" r="5.5" fill="#e6a0c4"/>
    <!-- worktree commit dots -->
    <circle cx="184" cy="226" r="5.5" fill="#f6a87c"/>
    <circle cx="240" cy="226" r="5.5" fill="#f6a87c" opacity="0.85"/>
    <circle cx="300" cy="226" r="5.5" fill="#7fe7d0"/>
  </g>
</svg>
